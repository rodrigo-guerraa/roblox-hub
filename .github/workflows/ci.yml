name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools pinned in template/rokit.toml
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # privacy guards, format check, then lint and build of the template with every system installed
      - name: Checks
        run: bash scripts/check.sh
